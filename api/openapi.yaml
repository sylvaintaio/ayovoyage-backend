components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        company_id:
          type: string
        company_name:
          type: string
        next_tier:
          $ref: "#/components/schemas/Tier"
        perks:
          description: Avantages du niveau actuel
          items:
            type: string
          type: array
        points_balance:
          format: int32
          type: integer
        points_value:
          description: Valeur des points en XOF
          format: int64
          type: integer
        tier_code:
          type: string
        tier_name:
          type: string
        trips_12m:
          format: int32
          type: integer
        trips_to_next_tier:
          format: int32
          type: integer
      required:
        - company_id
        - company_name
        - points_balance
        - points_value
        - tier_code
        - tier_name
        - trips_12m
        - perks
      type: object
    AccountDetail:
      additionalProperties: false
      properties:
        company_id:
          type: string
        company_name:
          type: string
        history:
          items:
            $ref: "#/components/schemas/LedgerEntry"
          type: array
        next_tier:
          $ref: "#/components/schemas/Tier"
        perks:
          description: Avantages du niveau actuel
          items:
            type: string
          type: array
        points_balance:
          format: int32
          type: integer
        points_value:
          description: Valeur des points en XOF
          format: int64
          type: integer
        tier_code:
          type: string
        tier_name:
          type: string
        tiers:
          items:
            $ref: "#/components/schemas/Tier"
          type: array
        trips_12m:
          format: int32
          type: integer
        trips_to_next_tier:
          format: int32
          type: integer
      required:
        - tiers
        - history
        - company_id
        - company_name
        - points_balance
        - points_value
        - tier_code
        - tier_name
        - trips_12m
        - perks
      type: object
    Adjust-loyalty-pointsRequest:
      additionalProperties: false
      properties:
        customer_phone:
          maxLength: 20
          minLength: 8
          type: string
        points:
          description: Positif pour créditer, négatif pour débiter
          format: int32
          maximum: 100000
          minimum: -100000
          type: integer
        reason:
          maxLength: 300
          minLength: 5
          type: string
      required:
        - customer_phone
        - points
        - reason
      type: object
    AdminDeparture:
      additionalProperties: false
      properties:
        agent_id:
          type: string
        arrival_eta:
          format: date-time
          type: string
        base_price:
          format: int64
          type: integer
        boarded_seats:
          format: int32
          type: integer
        bus_id:
          type: string
        crew:
          description: Contrôleur, chauffeur et autres membres
          items:
            $ref: "#/components/schemas/CrewMember"
          type: array
        departure_at:
          format: date-time
          type: string
        driver_id:
          type: string
        id:
          type: string
        notes:
          type: string
        peak_seats:
          description: "Charge maximale sur un tronçon : places libres = seat_count - peak_seats (sold_seats compte les passagers, revente comprise)"
          format: int32
          type: integer
        plate_number:
          type: string
        route_id:
          type: string
        route_name:
          type: string
        seat_count:
          format: int32
          type: integer
        sold_seats:
          format: int32
          type: integer
        status:
          enum:
            - scheduled
            - boarding
            - departed
            - arrived
            - cancelled
          type: string
        stops:
          description: Arrêts et heures prévues
          items:
            $ref: "#/components/schemas/DepartureStop"
          type: array
      required:
        - id
        - route_id
        - route_name
        - bus_id
        - plate_number
        - departure_at
        - arrival_eta
        - base_price
        - status
        - notes
        - seat_count
        - sold_seats
        - boarded_seats
        - peak_seats
      type: object
    Agency:
      additionalProperties: false
      properties:
        address:
          type: string
        city_id:
          type: string
        city_name:
          type: string
        city_slug:
          type: string
        company_id:
          type: string
        company_name:
          type: string
        email:
          type: string
        id:
          type: string
        instructions:
          description: Consignes aux voyageurs
          type: string
        is_active:
          type: boolean
        landmark:
          description: Point de repère
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        opening_hours:
          items:
            $ref: "#/components/schemas/OpeningHours"
          type: array
        phone:
          type: string
        photos:
          items:
            type: string
          type: array
        services:
          description: ticketing, parcel_drop, parcel_pickup, lounge
          items:
            type: string
          type: array
        slug:
          type: string
        whatsapp:
          type: string
      required:
        - id
        - company_id
        - city_id
        - city_name
        - name
        - slug
        - address
        - landmark
        - phone
        - whatsapp
        - email
        - opening_hours
        - services
        - instructions
        - photos
        - is_active
      type: object
    AgencyDetail:
      additionalProperties: false
      properties:
        address:
          type: string
        city_id:
          type: string
        city_name:
          type: string
        city_slug:
          type: string
        company_id:
          type: string
        company_name:
          type: string
        destinations:
          items:
            $ref: "#/components/schemas/City"
          type: array
        email:
          type: string
        id:
          type: string
        instructions:
          description: Consignes aux voyageurs
          type: string
        is_active:
          type: boolean
        landmark:
          description: Point de repère
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        opening_hours:
          items:
            $ref: "#/components/schemas/OpeningHours"
          type: array
        phone:
          type: string
        photos:
          items:
            type: string
          type: array
        services:
          description: ticketing, parcel_drop, parcel_pickup, lounge
          items:
            type: string
          type: array
        slug:
          type: string
        upcoming_departures:
          description: Départs des 3 prochains jours
          items:
            $ref: "#/components/schemas/UpcomingDeparture"
          type: array
        whatsapp:
          type: string
      required:
        - destinations
        - upcoming_departures
        - id
        - company_id
        - city_id
        - city_name
        - name
        - slug
        - address
        - landmark
        - phone
        - whatsapp
        - email
        - opening_hours
        - services
        - instructions
        - photos
        - is_active
      type: object
    AgencyInput:
      additionalProperties: false
      properties:
        address:
          maxLength: 250
          type: string
        city_id:
          type: string
        email:
          maxLength: 254
          type: string
        instructions:
          maxLength: 2000
          type: string
        is_active:
          type: boolean
        landmark:
          maxLength: 250
          type: string
        latitude:
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          maxLength: 120
          minLength: 2
          type: string
        opening_hours:
          items:
            $ref: "#/components/schemas/OpeningHours"
          maxItems: 14
          type: array
        phone:
          maxLength: 20
          type: string
        photos:
          items:
            type: string
          maxItems: 10
          type: array
        services:
          items:
            enum:
              - ticketing
              - parcel_drop
              - parcel_pickup
              - lounge
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        whatsapp:
          maxLength: 20
          type: string
      required:
        - city_id
        - name
        - address
        - services
        - is_active
      type: object
    AgencyRevenue:
      additionalProperties: false
      properties:
        agency_id:
          type: string
        agency_name:
          type: string
        bookings:
          format: int32
          type: integer
        revenue:
          format: int64
          type: integer
      required:
        - agency_id
        - agency_name
        - bookings
        - revenue
      type: object
    Agent-change-departure-statusRequest:
      additionalProperties: false
      properties:
        status:
          enum:
            - boarding
            - departed
            - arrived
          type: string
      required:
        - status
      type: object
    Agent-change-departure-statusResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    AgentDevice:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
      required:
        - id
        - name
        - platform
      type: object
    Assign-parcelRequest:
      additionalProperties: false
      properties:
        departure_id:
          format: uuid
          type: string
        reason:
          maxLength: 300
          type: string
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_type:
          type: string
        after: {}
        before: {}
        created_at:
          format: date-time
          type: string
        entity_id:
          type: string
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        ip:
          type: string
      required:
        - id
        - actor_type
        - action
        - entity_type
        - entity_id
        - ip
        - created_at
      type: object
    AuthOptions:
      additionalProperties: false
      properties:
        channels:
          description: "Canaux actifs, par ordre de préférence : email, sms"
          items:
            type: string
          type: array
      required:
        - channels
      type: object
    Baggage:
      additionalProperties: false
      properties:
        booking_id:
          type: string
        booking_reference:
          type: string
        booking_seat_id:
          type: string
        created_at:
          format: date-time
          type: string
        delivered_at:
          format: date-time
          type: string
        departure_id:
          type: string
        description:
          type: string
        extra_fee:
          description: Excédent encaissé
          format: int64
          type: integer
        id:
          type: string
        loaded_at:
          format: date-time
          type: string
        passenger_name:
          type: string
        seat_label:
          type: string
        status:
          enum:
            - checked
            - loaded
            - unloaded
            - delivered
            - missing
            - cancelled
          type: string
        tag_number:
          type: string
        unloaded_at:
          format: date-time
          type: string
        weight_kg:
          format: double
          type: number
      required:
        - id
        - tag_number
        - booking_id
        - booking_seat_id
        - passenger_name
        - seat_label
        - departure_id
        - weight_kg
        - description
        - extra_fee
        - status
        - created_at
      type: object
    Block-departure-seatRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 200
          type: string
        seat_id:
          type: string
      required:
        - seat_id
      type: object
    BookedSeat:
      additionalProperties: false
      properties:
        base_price:
          format: int64
          type: integer
        booking_seat_id:
          description: Identifiant du passager dans la réservation (bagages)
