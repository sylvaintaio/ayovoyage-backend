  /v1/auth/otp/request:
    post:
      description: "Fournir `email` ou `phone` (un seul). Envoie un code à 6 chiffres valable 5 minutes. Limites : 3 demandes / 10 min par destinataire, 20 / heure par adresse IP. Canaux actifs : `GET /v1/public/auth-options`. En développement, si le pilote d'envoi est `log` (rien n'est réellement envoyé), le code est renvoyé dans `dev_code`."
      operationId: request-otp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPTarget"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPSent"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Demander un code de connexion (e-mail ou SMS)
      tags:
        - Authentification
  /v1/auth/otp/verify:
    post:
      description: Même `email` ou `phone` que lors de la demande. Crée le compte client au premier passage. 5 essais maximum par code.
      operationId: verify-otp
      parameters:
        - description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
          in: header
          name: X-Client-Type
          schema:
            default: mobile
            description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
            enum:
              - web
              - mobile
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verify-otpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Valider le code et ouvrir une session client
      tags:
        - Authentification
  /v1/auth/refresh:
    post:
      description: "Web : le jeton est lu dans le cookie `bv_refresh`. Mobile : dans le corps. Un jeton déjà utilisé révoque toute la session (détection de vol)."
      operationId: refresh-session
      parameters:
        - description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
          in: header
          name: X-Client-Type
          schema:
            default: mobile
            description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
            enum:
              - web
              - mobile
            type: string
        - in: cookie
          name: bv_refresh
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh-sessionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
