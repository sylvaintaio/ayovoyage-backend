        - id
        - plate_number
        - internal_code
        - model
        - layout_id
        - amenities
        - status
        - notes
      type: object
    BusInput:
      additionalProperties: false
      properties:
        amenities:
          examples:
            - - climatisation
              - wifi
              - usb
          items:
            type: string
          maxItems: 20
          type: array
        home_agency_id:
          type: string
        internal_code:
          maxLength: 30
          type: string
        layout_id:
          type: string
        model:
          maxLength: 80
          type: string
        notes:
          maxLength: 2000
          type: string
        plate_number:
          maxLength: 20
          minLength: 4
          type: string
        status:
          default: active
          enum:
            - active
            - maintenance
            - out_of_service
          type: string
      required:
        - plate_number
        - layout_id
      type: object
    Cancel-bookingRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 300
          minLength: 3
          type: string
        waive_fee:
          description: Rembourser sans frais d'annulation
          type: boolean
      required:
        - reason
      type: object
    Cancel-my-bookingRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 300
          type: string
      type: object
    Cancel-parcelRequest:
      additionalProperties: false
      properties:
        departure_id:
          format: uuid
          type: string
        reason:
          maxLength: 300
          type: string
      type: object
    CancelPolicy:
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        cutoff_hours:
          format: int32
          type: integer
        deadline:
          description: Annulation en ligne possible jusqu'à cette date
          format: date-time
          type: string
        fee_percent:
          format: int32
          type: integer
        paid_amount:
          description: Valeur payée du billet (hors points et frais de modification)
          format: int64
          type: integer
        reason:
          description: Pourquoi l'annulation n'est pas possible
          type: string
        refund_amount:
          description: Montant qui serait remboursé en cas d'annulation maintenant
          format: int64
          type: integer
        tier_name:
          description: Niveau de fidélité dont l'avantage est appliqué
          type: string
      required:
        - allowed
        - cutoff_hours
        - fee_percent
        - paid_amount
        - refund_amount
      type: object
    CashClosure:
