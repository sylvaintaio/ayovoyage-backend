      parameters:
        - in: header
          name: X-Client-Type
          schema:
            default: mobile
            enum:
              - web
              - mobile
            type: string
        - in: cookie
          name: bv_refresh
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Staff-mfa-step-upRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Confirmer son identité pour une action sensible
      tags:
        - Double authentification
  /v1/auth/staff/mfa/setup:
    post:
      description: Avec le jeton d'étape `setup` (connexion) ou une session du personnel. Le secret n'est actif qu'après `/activate`.
      operationId: staff-mfa-setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Staff-mfa-setupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetup"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Activer la double authentification : obtenir le QR code"
      tags:
        - Double authentification
  /v1/auth/staff/mfa/verify:
    post:
      description: Code de l'application d'authentification, ou un code de secours à usage unique. Un code déjà utilisé est refusé.
      operationId: staff-mfa-verify
      parameters:
        - in: header
          name: X-Client-Type
