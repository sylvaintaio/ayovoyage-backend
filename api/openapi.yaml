          description: Error
      summary: Renouveler la session (rotation du jeton)
      tags:
        - Authentification
  /v1/auth/staff/login:
    post:
      description: "Verrouillage de 15 minutes après 5 échecs consécutifs (mot de passe et codes confondus). Si `mfa_step` est renvoyé, aucune session n'est ouverte : `verify` → `POST /v1/auth/staff/mfa/verify` ; `setup` → `POST /v1/auth/staff/mfa/setup` puis `/activate`. Les rôles de l'application Agent ne sont pas concernés."
      operationId: staff-login
      parameters:
        - description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
          in: header
          name: X-Client-Type
          schema:
            default: mobile
            description: "web : jetons en cookies HttpOnly uniquement ; mobile : jetons dans le corps de la réponse"
            enum:
              - web
              - mobile
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Staff-loginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Connexion du personnel (étape 1 : mot de passe)"
      tags:
        - Authentification
  /v1/auth/staff/mfa/activate:
    post:
      description: Renvoie une session et **10 codes de secours** (affichés une seule fois).
      operationId: staff-mfa-activate
      parameters:
        - in: header
          name: X-Client-Type
          schema:
            default: mobile
            enum:
              - web
              - mobile
            type: string
        - in: cookie
          name: bv_refresh
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Staff-mfa-activateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Activer la double authentification : confirmer avec un premier code"
      tags:
        - Double authentification
  /v1/auth/staff/mfa/confirm:
    post:
      description: |-
        À appeler quand une opération répond 403 avec l'en-tête `X-MFA-Required: step-up`, puis rejouer l'opération. La vérification reste valable 15 minutes.

        Réservé au **personnel** (tous rôles).
