        category_code:
          type: string
        category_name:
          type: string
        category_surcharge:
          format: int64
          type: integer
        discount_amount:
          description: Réduction liée au niveau de fidélité
          format: int64
          type: integer
        passenger_name:
          type: string
        passenger_phone:
          type: string
        seat_id:
          type: string
        seat_label:
          type: string
        seat_surcharge:
          format: int64
          type: integer
        status:
          enum:
            - held
            - sold
            - cancelled
            - expired
          type: string
        total_price:
          format: int64
          type: integer
      required:
        - booking_seat_id
        - seat_id
        - seat_label
        - category_code
        - category_name
        - passenger_name
        - base_price
        - category_surcharge
        - seat_surcharge
        - discount_amount
        - total_price
        - status
