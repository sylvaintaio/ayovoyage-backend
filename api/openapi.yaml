        subtotal_amount:
          format: int64
          type: integer
        total_amount:
          description: Montant à payer
          format: int64
          type: integer
      required:
        - id
        - reference
        - company_id
        - status
        - channel
        - contact_name
        - contact_phone
        - subtotal_amount
        - discount_amount
        - loyalty_points_used
        - loyalty_points_amount
        - total_amount
        - currency
        - expires_at
        - created_at
        - change_count
        - change_fee_amount
        - change_credit_amount
        - payment_mode
        - early_bird_amount
        - promo_amount
        - referral_amount
      type: object
    BookingDetail:
      additionalProperties: false
      properties:
        billing_name:
          description: Facture au nom de cette entreprise
          type: string
        billing_tax_id:
          type: string
        cancel_reason:
          type: string
        cancelled_at:
          format: date-time
          type: string
        change_count:
          format: int32
