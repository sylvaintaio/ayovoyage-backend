# Site Nginx de l'API : installé par setup-server.sh dans /etc/nginx/sites-available/__DOMAIN__
# (__DOMAIN__ et __PORT__ remplacés), puis certbot y ajoute le HTTPS.

# IP du client : celle transmise par Vercel (X-Real-IP) si présente, sinon l'adresse de connexion
# (applications mobiles, webhooks FedaPay).
map $http_x_real_ip $busvoyage_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

upstream busvoyage_api {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Photos jointes (2 Mo chacune, encodées) et signatures.
    client_max_body_size 12m;

    access_log /var/log/nginx/busvoyage-api.access.log;
    error_log  /var/log/nginx/busvoyage-api.error.log;

    location / {
        proxy_pass http://busvoyage_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $busvoyage_client_ip;
        proxy_set_header X-Forwarded-For $busvoyage_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # En-tête non utilisé : empêche un client d'imposer une fausse IP par ce biais.
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 60s;
    }
}
